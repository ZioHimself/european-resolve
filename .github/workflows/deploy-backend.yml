name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      - run: npx tsc --noEmit
        working-directory: backend

  deploy:
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/european-resolve/api:${{ github.sha }} \
            backend/

      - name: Push Docker image
        run: |
          docker push ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/european-resolve/api:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: run-for-ukraine-api
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/european-resolve/api:${{ github.sha }}
          region: ${{ vars.GCP_REGION }}
          # Required GitHub Secrets for SMTP (email confirmation):
          #   SMTP_HOST     — smtp.mailbox.org
          #   SMTP_PORT     — 465
          #   SMTP_USER     — info@european-resolve.org
          #   SMTP_PASS     — mailbox.org app password
          #   SMTP_FROM     — Run for Ukraine 2026 <info@european-resolve.org>
          # Add via: Settings > Secrets and variables > Actions > Secrets
          env_vars: |
            SPREADSHEET_ID=${{ vars.SPREADSHEET_ID }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
            WHYDONATE_WIDGET_URL=${{ vars.WHYDONATE_WIDGET_URL }}
            GOOGLE_DRIVE_FOLDER_ID=${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
            GALLERY_FOLDER_ID=${{ vars.GALLERY_FOLDER_ID }}
            NODE_ENV=production
            SMTP_HOST=${{ vars.SMTP_HOST }}
            SMTP_PORT=${{ vars.SMTP_PORT }}
            SMTP_USER=${{ vars.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            SMTP_FROM=${{ vars.SMTP_FROM }}
